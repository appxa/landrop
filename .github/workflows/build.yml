name: Build

on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Build Linux + deb
        run: sh scripts/build-go.sh
      - uses: actions/upload-artifact@v4
        with:
          name: landrop-linux
          path: |
            dist/landrop
            dist/landrop_*.deb
          retention-days: 7

  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Build Windows exe
        run: |
          mkdir -p dist
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "-s -w" -o dist/landrop.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: landrop-windows
          path: dist/landrop.exe
          retention-days: 7